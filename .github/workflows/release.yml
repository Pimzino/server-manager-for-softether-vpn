name: Release

# Packages the desktop app (macOS dmg/zip, Windows NSIS setup/zip/MSI) with scripts/dist.mjs,
# which also verifies every artifact, and publishes a draft GitHub release whose body lists the commits since the
# previous tag (scripts/ci/release-notes.sh).
#
#   release:  bump "version" in package.json on main, then push the tag v<version>
#   dry run:  run this workflow manually, or open a PR that touches the packaging files: the
#             installers are built and verified and the release notes for that commit are generated, all kept
#             as workflow artifacts, nothing is published
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - installer/**
      - build/**
      - electron-builder.config.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------------------------
  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------------------------
  package:
    name: Package desktop app (macOS and Windows installers)
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - name: Version (a release tag must match package.json)
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - name: MSI tools (wixl)
        run: brew install msitools
      - run: pnpm install --frozen-lockfile
      # Windows files (app, setup, MSI) are Authenticode-signed with the project's self-signed certificate when
      # the secrets are available (not on pull requests from forks). See docs/desktop-packaging.md.
      - name: Build, package and verify
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # electron-builder skips all signing on pull requests by default, including the ad-hoc macOS signature
          # the app needs to start at all. Pull requests from forks get no secrets, so this exposes nothing.
          CSC_FOR_PULL_REQUEST: true
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          # --no-cross-launch: the x64 macOS build is verified but not started (Rosetta in the runner VM never
          # brings Electron up); the arm64 build is started and screenshotted
          pnpm run dist --no-cross-launch
          cp build/codesign/SoftEther-Manager-codesign.cer release/
      - name: Build report
        if: always()
        run: cat release/BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/*.cer
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-report
          path: |
            release/BUILD-REPORT.md
            release/verification
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  notes:
    name: Release notes (commits since the previous tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes
        run: |
          tag="$GITHUB_REF_NAME"
          # Dry run: the notes a release of this commit would get
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag="v$(node -p 'require("./package.json").version')-dry-run"
            git tag "$tag"
          fi
          bash scripts/ci/release-notes.sh "$tag" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [ci, package, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: installers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Verify checksums
        working-directory: installers
        run: sha256sum -c SHA256SUMS
      # Build provenance, verifiable with: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: installers/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" installers/* --draft --verify-tag --notes-file release-notes.md \
            --title "Server Manager for SoftEther VPN ${GITHUB_REF_NAME#v}" "${flags[@]}"
